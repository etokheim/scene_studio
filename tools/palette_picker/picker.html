<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Palette picture picker</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #14120f; color: #f3efe6; font: 15px/1.4 system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; background: #14120f; padding: 16px 24px 12px; border-bottom: 1px solid #2c2822; }
    h1 { font-size: 20px; font-weight: 560; margin: 0 0 4px; }
    header p { margin: 0; color: #b7b0a4; }
    section { padding: 8px 24px 28px; }
    h2 { font-size: 18px; font-weight: 560; margin: 22px 0 12px; }
    article { background: #1c1915; border-radius: 14px; padding: 14px 14px 12px; margin: 0 0 16px; }
    .head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 10px; }
    .head strong { font-size: 16px; }
    .need { color: #e2b15a; font-size: 13px; }
    .row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
    figure { margin: 0; width: 220px; flex: 0 0 220px; background: #12100d; border-radius: 12px; overflow: hidden; border: 2px solid transparent; position: relative; }
    figure.picked { border-color: #e7d7b1; }
    figure button.x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: #000a; color: #fff; cursor: pointer; font-size: 16px; }
    figure img { width: 100%; height: 140px; object-fit: cover; display: block; cursor: pointer; background: #0c0b09; }
    .swatches { display: flex; gap: 6px; padding: 8px 8px 4px; }
    .swatches span { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.35); }
    figcaption { padding: 0 8px 8px; color: #b7b0a4; font-size: 12px; }
    figcaption a { color: #e7d7b1; }
    label.note { display: block; margin-top: 10px; color: #b7b0a4; font-size: 13px; }
    textarea { width: 100%; box-sizing: border-box; margin-top: 4px; min-height: 56px; border-radius: 8px; border: 1px solid #3a342c; background: #100e0c; color: inherit; font: inherit; padding: 8px; resize: vertical; }
    .empty { color: #b7b0a4; padding: 8px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Palette picture picker</h1>
    <p>Click a photo to choose it. The × drops one you do not want. Five colors under each photo are the palette that picture would make. Leave a note if the scene, the photo, or the colors are wrong.</p>
  </header>
  <main id="app"></main>
  <script src="picker.js"></script>
</body>
</html>
